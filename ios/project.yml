name: OChords
options:
  bundleIdPrefix: com.onezcodes
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  # Pinned. Google AdMob (banner, interstitial, rewarded ads on the free plan) and Google Sign-In.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    exactVersion: 13.11.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.0.0
targets:
  OChords:
    type: application
    platform: iOS
    sources:
      - path: OChords
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: OChords/OChords.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onezcodes.ochords
        PRODUCT_NAME: O Chords
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: O Chords
        INFOPLIST_KEY_NSCameraUsageDescription: O Chords uses the camera to scan chord sheets, and the front camera to turn pages when you nod.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: O Chords uses the microphone for the tuner, chord check, Listen, Follow me and voice page turns.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: O Chords listens for “next”, “back” and “chorus” to turn pages in Stage when you choose voice page turns.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save chord diagrams to your photos.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: O Chords connects to a development server on your local network.
        INFOPLIST_KEY_NSUserTrackingUsageDescription: With your permission, Google may use an advertising ID to show ads that fit you. Your songs and recordings are never shared.
      configs:
        # The O Chords API. Debug: the Laravel dev server on this Mac (api/, `php artisan serve --host=0.0.0.0`),
        # by its Bonjour name so both the simulator and a real iPhone on the same Wi-Fi reach it.
        # Another developer: change the host to their Mac (`scutil --get LocalHostName` + ".local").
        # Release: set to the production HTTPS URL before shipping; empty = the app runs on demo data.
        #
        # AdMob: Debug uses Google's public test app and ad units (they always serve test ads). Release: the real
        # IDs from the AdMob console before shipping; an empty app ID = the app's own ad placeholders, no SDK.
        # Google Sign-In: the iOS OAuth client ID from Google Cloud (and its reversed form as the URL scheme);
        # empty = the Google button says it isn't set up yet.
        Debug:
          OCHORDS_API_URL: http://Zeno-Macbook.local:8000/api/v1
          OCHORDS_ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
          OCHORDS_ADMOB_BANNER: ca-app-pub-3940256099942544/2435281174
          OCHORDS_ADMOB_INTERSTITIAL: ca-app-pub-3940256099942544/4411468910
          OCHORDS_ADMOB_REWARDED: ca-app-pub-3940256099942544/1712485313
          OCHORDS_GOOGLE_CLIENT_ID: ""
          OCHORDS_GOOGLE_URL_SCHEME: ""
        Release:
          OCHORDS_API_URL: ""
          OCHORDS_ADMOB_APP_ID: ""
          OCHORDS_ADMOB_BANNER: ""
          OCHORDS_ADMOB_INTERSTITIAL: ""
          OCHORDS_ADMOB_REWARDED: ""
          OCHORDS_GOOGLE_CLIENT_ID: ""
          OCHORDS_GOOGLE_URL_SCHEME: ""
    info:
      path: OChords/Info.plist
      properties:
        UIAppFonts:
          - Outfit.ttf
          - JetBrainsMono.ttf
          - NotoSansMyanmar.ttf
        OChordsAPIBaseURL: $(OCHORDS_API_URL)
        # Plain HTTP only to local addresses (the dev server); everything else must be HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Google AdMob (see the configs above).
        GADApplicationIdentifier: $(OCHORDS_ADMOB_APP_ID)
        OChordsAdMobAppID: $(OCHORDS_ADMOB_APP_ID)
        OChordsAdMobBannerUnit: $(OCHORDS_ADMOB_BANNER)
        OChordsAdMobInterstitialUnit: $(OCHORDS_ADMOB_INTERSTITIAL)
        OChordsAdMobRewardedUnit: $(OCHORDS_ADMOB_REWARDED)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        # Google Sign-In.
        OChordsGoogleClientID: $(OCHORDS_GOOGLE_CLIENT_ID)
        # `ochords://reset-password?token=…` from the reset email, and Google Sign-In's return URL.
        CFBundleURLTypes:
          - CFBundleURLName: com.onezcodes.ochords
            CFBundleURLSchemes: [ochords]
          - CFBundleURLName: com.onezcodes.ochords.google
            CFBundleURLSchemes: [$(OCHORDS_GOOGLE_URL_SCHEME)]
schemes:
  OChords:
    build:
      targets:
        OChords: all
    run:
      config: Debug
      # Local App Store: the Pro subscriptions with a 7-day trial, so purchases work in the simulator.
      storeKitConfiguration: OChords/OChords.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
